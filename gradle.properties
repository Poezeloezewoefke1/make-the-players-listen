# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / Fabric toolchain (pinned to 1.21.11)
minecraft_version=1.21.11
# "+build.+" always resolves to the newest Yarn build published for 1.21.11.
# Replace with a fixed build (e.g. 1.21.11+build.4) if you want a reproducible build.
yarn_mappings=1.21.11+build.+
loader_version=0.17.3
loom_version=1.13.3

# Mod
mod_version=1.0.0
maven_group=dev.mtpl
archives_base_name=make-the-players-listen
