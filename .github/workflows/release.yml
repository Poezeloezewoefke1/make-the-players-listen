# Publishes a GitHub release for the version in gradle.properties.
#
# It runs on a push and creates the release only when one does not exist yet for that
# version, so bumping mod_version and pushing cuts a new release while ordinary commits
# do nothing. The tag is created here, at the commit that was built - handy when your
# git client cannot push tags.
#
# The jar attached to the release is built by this workflow rather than uploaded by
# hand, so what people download is exactly what the build produced.

name: release

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --stacktrace

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')

          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' | head -1)

          if [ -z "$JAR" ]; then
            echo "no mod jar was produced"
            ls -la build/libs || true
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            echo "creating release $TAG at ${GITHUB_SHA}"
            CREATE=1
          fi

          NOTES=$(cat <<NOTE
          Server-side moderation and event tools for **Minecraft $MC** (Fabric).

          ### Install

          1. Download \`$(basename "$JAR")\` below.
          2. Drop it into your server's \`mods/\` folder.
          3. Restart the server.

          Nothing has to be installed on the client, and **Fabric API is not required** - this
          jar is the only file you need. Requires Fabric Loader $LOADER or newer and Java 21.

          ### Commands (operators only)

          | Command | What it does |
          |---|---|
          | \`/freeze <targets> [duration] [reason]\` | Freezes players completely: no walking, jumping, flying, elytra, riding, ender pearls, not even turning their head |
          | \`/unfreeze <name>\` | Unfreezes, also works while the player is offline |
          | \`/freezelist\` / \`/unfreezeall\` | List everyone frozen / unfreeze everybody |
          | \`/mute <targets> [duration] [reason]\` | Mutes chat, permanently or for a while (\`30s\`, \`10m\`, \`2h\`, \`7d\`, \`1h30m\`, \`perm\`) |
          | \`/unmute <name>\` | Unmutes, also works while the player is offline |
          | \`/mutelist\` / \`/unmuteall\` | List everyone muted / unmute everybody |
          | \`/kitgive <tier> [targets]\` | Hands out a worn set of armour, tools and a shield with random enchantments. Tiers, weakest first: \`poor\`, \`copper\`, \`iron\`, \`chungie\`, \`diamond\`, \`rich\`, \`netherite\`, \`diamondprot4nomendingunbreaking3\` - or \`random\` to roll the tier per player |
          | \`/vcmute <targets> [duration] [reason]\` | Mutes a player in Simple Voice Chat - they cannot talk and nobody hears them. No duration means until it is lifted |
          | \`/vcdeafen <targets> [duration] [reason]\` | Deafens a player in voice chat - they hear nobody |
          | \`/vcunmute <name>\` / \`/vcundeafen <name>\` | Lifts one, or \`all\` to lift every one |
          | \`/vclist\` / \`/vcinfo <name>\` / \`/vcstatus\` | Who is punished, one player's status, and whether the voice chat plugin is enforcing |
          | \`/lobby\` / \`/lobby <targets>\` / \`/lobby all\` | Go to the lobby, send players there, or pull everybody back |
          | \`/lobby enable\` / \`/lobby disable\` / \`/lobby setspawn\` / \`/lobby status\` | Turn the routing on and off, set the spawn, see where things stand |
          | \`/lobby course ...\` | Build parkour courses: \`create\`, \`checkpoint\`, \`undo\`, \`start\`, \`finish\`, \`tp\`, \`top\`, \`list\`, \`delete\` |
          | \`/queue\` / \`/queue list\` | Line length, slots used, cap; and who is in, who is waiting, in order |
          | \`/queue cap [slots]\` / \`/queue open\` / \`/queue close\` / \`/queue end\` | How many may be in the world, whether anybody is let through, and ending the session |
          | \`/queue bypass <targets>\` / \`/queue early add|remove|list\` | Let somebody straight in, or put them on the list that never sees the queue |

          ### The lobby

          Off by default; \`/lobby enable\` turns it on. Everybody who is not staff and has no
          early access lands in \`astra:lobby\` when they join, in adventure mode, and takes a
          place in a strictly first come, first served line. Position and total sit on a boss
          bar; the title and the sound cue fire when a slot actually opens, not when somebody
          reaches the front.

          The dimension ships as a data pack the mod writes into the world folder itself, so
          the single jar is still the only file you need. It is a void world with permanent
          noon, no mobs and a stone platform under the spawn.

          Members can walk, run, jump and run the parkour, and nothing else: no breaking,
          placing, hitting, dropping, inventory, item use, signs, books, chat or voice. That is
          the freeze with the movement left switched on, through the same code. They are hidden
          from each other and cannot collide; staff see everybody, keep every right, and never
          take up a slot.

          Two grace windows, both five minutes by default: a queued player who drops out keeps
          their place, an admitted one keeps their slot. The whole queue is written to disk, so
          a restart does not cost anybody their place. There is no AFK handling on purpose -
          staff decide, and a kick voids the grace straight away.

          Parkour courses are built by standing where each marker goes. The clock starts when
          you step off the start pad, a fall puts you back on your last checkpoint rather than
          killing you, and only a player's best time per course is kept.

          A kit is gear and nothing else - four pieces of armour, four tools and a shield, with
          no food, blocks or loot. It is rolled per player, so handing one command to a group
          gives each of them different wear and different enchantments at randomly rolled levels.
          Every enchanted piece gets its main enchantment - Protection on armour, Sharpness on a
          weapon, Efficiency on a digging tool - with side enchantments on top, so a diamond
          helmet reads as Protection III and Aqua Affinity rather than one lucky roll. Netherite
          does not roll at all: it gets every enchantment its item can carry, at maximum level.
          No Thorns, and no situational variants - plain Protection and plain Sharpness only.

          Simple Voice Chat is a soft dependency: the \`/vc\` commands are always there and always
          remember who is punished, and they start being enforced the moment the voice chat mod
          is installed. Nothing else changes without it.

          The mod also checks GitHub for a newer release on every server start and installs it
          for the next restart. Turn it off with \`autoUpdate\` in the config.

          Freezes and mutes survive relogs and restarts, and timed mutes expire on their own.
          The mute is applied where chat is delivered, so it also covers \`/msg\`, \`/tell\`,
          \`/w\`, \`/me\`, \`/say\` and \`/teammsg\` without breaking Minecraft's chat signature
          chain.

          See the README for the full details and the known limits.
          NOTE
          )

          # Strip the leading indentation the heredoc keeps.
          NOTES=$(printf '%s\n' "$NOTES" | sed 's/^          //')

          if [ "${CREATE:-0}" = "1" ]; then
            gh release create "$TAG" "$JAR" \
              --target "${GITHUB_SHA}" \
              --title "$TAG - Make The Players Listen" \
              --notes "$NOTES"
          fi

          # Never leave a sources jar attached to a release. It carries a fabric.mod.json
          # with the version placeholder unexpanded and no compiled classes, so dropping it
          # into mods/ makes Fabric load it as a mod and then fail with
          # "The specified mixin ... was not found". Only the mod jar belongs here.
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -- '-sources\.jar$' || true); do
            echo "removing stray asset $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done

          gh release view "$TAG"
