# Publishes a GitHub release for the version in gradle.properties.
#
# It runs on a push and creates the release only when one does not exist yet for that
# version, so bumping mod_version and pushing cuts a new release while ordinary commits
# do nothing. The tag is created here, at the commit that was built - handy when your
# git client cannot push tags.
#
# The jar attached to the release is built by this workflow rather than uploaded by
# hand, so what people download is exactly what the build produced.

name: release

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --stacktrace

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')

          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' | head -1)

          if [ -z "$JAR" ]; then
            echo "no mod jar was produced"
            ls -la build/libs || true
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            echo "creating release $TAG at ${GITHUB_SHA}"
            CREATE=1
          fi

          NOTES=$(cat <<NOTE
          Server-side moderation commands for **Minecraft $MC** (Fabric).

          ### Install

          1. Download \`$(basename "$JAR")\` below.
          2. Drop it into your server's \`mods/\` folder.
          3. Restart the server.

          Nothing has to be installed on the client, and **Fabric API is not required** - this
          jar is the only file you need. Requires Fabric Loader $LOADER or newer and Java 21.

          ### Commands (operators only)

          | Command | What it does |
          |---|---|
          | \`/freeze <targets> [duration] [reason]\` | Freezes players completely: no walking, jumping, flying, elytra, riding, ender pearls, not even turning their head |
          | \`/unfreeze <name>\` | Unfreezes, also works while the player is offline |
          | \`/freezelist\` / \`/unfreezeall\` | List everyone frozen / unfreeze everybody |
          | \`/mute <targets> [duration] [reason]\` | Mutes chat, permanently or for a while (\`30s\`, \`10m\`, \`2h\`, \`7d\`, \`1h30m\`, \`perm\`) |
          | \`/unmute <name>\` | Unmutes, also works while the player is offline |
          | \`/mutelist\` / \`/unmuteall\` | List everyone muted / unmute everybody |
          | \`/kitgive <tier> [targets]\` | Hands out a worn, randomly rolled kit. Tiers, weakest first: \`poor\`, \`copper\`, \`iron\`, \`iron_diamond\`, \`diamond\`, \`diamond_netherite\`, \`netherite\` - or \`random\` to roll the tier per player |

          Kits are rolled per player, so handing one command to a group gives each of them a
          different loadout: different materials in each slot, different wear, different
          enchantments at randomly rolled levels, and a different handful of supplies.

          Freezes and mutes survive relogs and restarts, and timed mutes expire on their own.
          The mute is applied where chat is delivered, so it also covers \`/msg\`, \`/tell\`,
          \`/w\`, \`/me\`, \`/say\` and \`/teammsg\` without breaking Minecraft's chat signature
          chain.

          See the README for the full details and the known limits.
          NOTE
          )

          # Strip the leading indentation the heredoc keeps.
          NOTES=$(printf '%s\n' "$NOTES" | sed 's/^          //')

          if [ "${CREATE:-0}" = "1" ]; then
            gh release create "$TAG" "$JAR" \
              --target "${GITHUB_SHA}" \
              --title "$TAG - Make The Players Listen" \
              --notes "$NOTES"
          fi

          # Never leave a sources jar attached to a release. It carries a fabric.mod.json
          # with the version placeholder unexpanded and no compiled classes, so dropping it
          # into mods/ makes Fabric load it as a mod and then fail with
          # "The specified mixin ... was not found". Only the mod jar belongs here.
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -- '-sources\.jar$' || true); do
            echo "removing stray asset $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done

          gh release view "$TAG"
