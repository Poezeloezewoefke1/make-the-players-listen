# Builds the mod on every push and pull request.
#
# This is the real compile check: Loom needs maven.fabricmc.net and Mojang's
# library servers, which the runners can reach.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: show yarn builds available for this minecraft version
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "minecraft_version=$MC"
          curl -sS --max-time 60 https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml \
            | grep -o "<version>${MC}+build\.[0-9]*</version>" | tail -5 || echo "no yarn build found for $MC"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --stacktrace

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: build/libs/
