# Builds the mod on every push and pull request.
#
# This is the real compile check: Loom needs maven.fabricmc.net and Mojang's
# library servers, which the runners can reach.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: list the item ids this version actually has
        continue-on-error: true
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          MANIFEST=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
          VERSION_URL=$(curl -sS --max-time 60 "$MANIFEST" \
            | jq -r --arg v "$MC" '.versions[] | select(.id==$v) | .url')
          echo "version json for $MC: $VERSION_URL"
          CLIENT=$(curl -sS --max-time 60 "$VERSION_URL" | jq -r '.downloads.client.url')
          curl -sSL --max-time 300 -o client.jar "$CLIENT"
          unzip -p client.jar assets/minecraft/lang/en_us.json > en_us.json
          ITEMS=$(grep -o '"item\.minecraft\.[a-z0-9_]*"' en_us.json \
            | sed 's/"item\.minecraft\.//; s/"//' | sort -u)
          echo "===== item ids containing 'spear' ====="
          echo "$ITEMS" | grep spear || echo "  (none - this version has no spear item)"
          echo "===== every lang key containing 'spear' ====="
          grep -o '"[a-z_]*\.minecraft\.[a-z0-9_]*"' en_us.json | grep spear | sort -u \
            || echo "  (none)"
          echo "===== the copper items, for naming reference ====="
          echo "$ITEMS" | grep '^copper' || echo "  (none)"
          echo "===== which enchantments each kit weapon may legitimately carry ====="
          # The enchantable tags decide what an item is allowed to hold, so this says whether a
          # spear really takes the sword enchantments the kits give it. They are written in terms
          # of other tags, so pull out every item tag and follow them.
          mkdir -p tags && unzip -q -o client.jar 'data/minecraft/tags/item/*' -d tags
          TAGS=tags/data/minecraft/tags/item
          echo "--- every item tag that mentions a spear ---"
          grep -rl spear "$TAGS" 2>/dev/null | sed "s|$TAGS/||" || echo "  (none)"
          for TAG in enchantable/melee_weapon enchantable/sharp_weapon enchantable/durability \
                     enchantable/fire_aspect swords spears; do
            echo "--- $TAG ---"
            unzip -p client.jar "data/minecraft/tags/item/$TAG.json" 2>/dev/null | tr -d ' \n' \
              || echo "  (no such tag)"
            echo
          done

      - name: dump the voice chat api we build against
        continue-on-error: true
        run: |
          API=$(grep '^voicechat_api_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "voicechat api versions published:"
          curl -sS --max-time 60 \
            https://maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-api/maven-metadata.xml \
            | grep -o '<version>[^<]*' | cut -d'>' -f2 | tail -15
          URL="https://maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-api/${API}/voicechat-api-${API}.jar"
          echo "voicechat api: $API"
          curl -sSL --max-time 120 -o vcapi.jar "$URL"
          mkdir -p vcapi && unzip -o -q vcapi.jar -d vcapi
          for CLASS in \
            de/maxhenkel/voicechat/api/events/SoundPacketEvent \
            de/maxhenkel/voicechat/api/events/MicrophonePacketEvent \
            de/maxhenkel/voicechat/api/events/EntitySoundPacketEvent \
            de/maxhenkel/voicechat/api/events/EventRegistration \
            de/maxhenkel/voicechat/api/VoicechatConnection \
            de/maxhenkel/voicechat/api/VoicechatPlugin; do
            echo "===== $CLASS ====="
            javap -cp vcapi "$(echo "$CLASS" | tr '/' '.')" || echo "  (not in this jar)"
          done

      - name: dump the pinned mappings for the classes we build against
        continue-on-error: true
        run: |
          PINNED=$(grep '^yarn_mappings=' gradle.properties | cut -d= -f2 | tr -d '\r')
          URL="https://maven.fabricmc.net/net/fabricmc/yarn/${PINNED}/yarn-${PINNED}-v2.jar"
          curl -sSL --max-time 120 -o yarn.jar "$URL"
          unzip -o -q yarn.jar -d yarn-mappings
          TINY=$(find yarn-mappings -name '*.tiny' | head -1)
          echo "mappings: $PINNED ($TINY)"

          # Members are "<tab>m<tab><descriptor><tab><intermediary><tab><named>" under a
          # "c<tab><intermediary><tab><named>" line, so print the block after the class line.
          dump() {
            local n
            n=$(grep -n -m1 -P "^c\t[^\t]+\t$1\$" "$TINY" | cut -d: -f1)
            echo "===== $1 ====="
            if [ -z "$n" ]; then
              echo "(not found in this build)"
              return
            fi
            sed -n "${n},$((n + 45))p" "$TINY"
          }

          dump net/minecraft/registry/DynamicRegistryManager
          dump net/minecraft/registry/Registry
          dump net/minecraft/registry/Registries

      - name: build
        run: ./gradlew build --stacktrace

      - name: show mappings available for this minecraft version
        if: always()
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          PINNED=$(grep '^yarn_mappings=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "MAPPINGS minecraft_version=[$MC] pinned=[$PINNED]"
          curl -sS --max-time 60 https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml > /tmp/yarn.xml || true
          echo "MAPPINGS available builds:"
          grep -o "<version>$MC+build\.[0-9]*</version>" /tmp/yarn.xml | sed 's|</\?version>||g' | tail -10 \
            || echo "MAPPINGS none found for $MC"

      - name: check the jar is a usable mod
        run: |
          set -euo pipefail
          JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' | head -1)
          echo "checking $JAR"

          fail=0

          # The version placeholder must have been expanded by processResources. A jar that
          # still says ${version} is the sources jar, which Fabric loads and then fails on.
          if unzip -p "$JAR" fabric.mod.json | grep -q '\${version}'; then
            echo "FAIL: fabric.mod.json still contains the unexpanded version placeholder"
            fail=1
          else
            echo "OK  : fabric.mod.json version is expanded"
          fi

          # Every mixin named in the config has to be present as a compiled class.
          for mixin in $(unzip -p "$JAR" freezemute.mixins.json | grep -oE '"[A-Za-z]+Mixin"' | tr -d '"'); do
            if unzip -l "$JAR" | grep -q "dev/mtpl/freezemute/mixin/${mixin}.class"; then
              echo "OK  : $mixin is compiled into the jar"
            else
              echo "FAIL: $mixin is named in freezemute.mixins.json but not in the jar"
              fail=1
            fi
          done

          if unzip -l "$JAR" | grep -q 'dev/mtpl/freezemute/FreezeMute.class'; then
            echo "OK  : entrypoint class is present"
          else
            echo "FAIL: entrypoint class is missing"
            fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "jar contents:"; unzip -l "$JAR"; exit 1; }

      - name: start a real server with the mod (smoke test)
        run: |
          set -o pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          INSTALLER=$(curl -sS --max-time 60 https://maven.fabricmc.net/net/fabricmc/fabric-installer/maven-metadata.xml \
            | grep -o '<release>[^<]*' | cut -d'>' -f2)
          echo "minecraft=$MC loader=$LOADER installer=$INSTALLER"

          curl -sSL --max-time 300 -o fabric-installer.jar \
            "https://maven.fabricmc.net/net/fabricmc/fabric-installer/$INSTALLER/fabric-installer-$INSTALLER.jar"

          mkdir -p run/mods
          java -jar fabric-installer.jar server -dir run -mcversion "$MC" -loader "$LOADER" -downloadMinecraft
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} run/mods/ \;
          ls -la run/mods

          echo "eula=true" > run/eula.txt

          # Pin the settings rather than letting the mod write its defaults, so the smoke test
          # never reaches out to GitHub and never touches the jar it is testing.
          mkdir -p run/config/freezemute
          echo '{"autoUpdate": false}' > run/config/freezemute/config.json
          {
            echo "online-mode=false"
            echo "level-type=minecraft:flat"
            echo "spawn-protection=0"
            echo "max-players=5"
            echo "sync-chunk-writes=false"
          } > run/server.properties

          LAUNCHER=$(ls run | grep -E '^fabric-server-(launch|launcher).*\.jar$' | head -1)
          echo "launcher=$LAUNCHER"

          cd run
          # Give the server time to come up, then drive it through the console.
          ( sleep 75
            echo "freezelist"
            sleep 3
            echo "mutelist"
            sleep 3
            echo "help kitgive"
            sleep 3
            echo "vclist"
            sleep 3
            echo "vcstatus"
            sleep 3
            echo "lobby status"
            sleep 3
            echo "queue status"
            sleep 3
            echo "queue cap 8"
            sleep 3
            echo "lobby course list"
            sleep 3
            echo "stop"
            sleep 20 ) | timeout 360 java -Xmx2G -jar "$LAUNCHER" nogui 2>&1 | tee server.log || true

          echo "===================== assertions ====================="
          fail=0
          check() {
            if grep -qF "$1" server.log; then
              echo "OK      : $2"
            else
              echo "MISSING : $2"
              fail=1
            fi
          }
          refute() {
            if grep -qE "$1" server.log; then
              echo "FOUND BAD: $2"
              grep -E "$1" server.log | head -5
              fail=1
            else
              echo "OK      : no $2"
            fi
          }

          check "Ready - operators can use" "mod initialised"
          check "Done (" "server finished starting"
          check "Nobody is frozen." "/freezelist ran from the console"
          check "Nobody is muted." "/mutelist ran from the console"
          check "Kit enchantments are on" "the enchantment registry lookup resolved"
          check "kitgive" "/kitgive registered"
          check "chungie" "the chungie tier registered"
          check "rich" "the rich tier registered"
          check "kitgive random" "the random tier registered"
          check "diamondprot4nomendingunbreaking3" "the fixed diamond tier registered"
          check "Kit items: every id resolved" "every kit item id exists in this version"
          check "Nobody is muted or deafened in voice chat." "/vclist ran from the console"
          check "Simple Voice Chat is not installed" "/vcstatus reports the voice chat mod is absent"
          check "Auto update is off" "the config file was read rather than overwritten"
          check "Lobby dimension: data pack written to" "the lobby data pack was written into the world"
          check "Lobby: player world lookup is on" "the world lookup resolved through intermediary"
          check "Lobby:" "the lobby state file was read"
          check "routing: off" "/lobby status ran and the lobby is off by default"
          check "The cap is 8." "/queue cap set the cap"
          check "No courses yet" "/lobby course list ran"
          refute "Kit items missing" "kit item ids that this version does not have"
          refute "Kit enchantments are off" "broken enchantment registry lookup"
          refute "player world lookup is off" "a broken player world lookup"
          refute "astra_lobby pack metadata" "complaints about the lobby data pack's metadata"
          refute "Unknown or incomplete command" "unrecognised command"
          refute "Mixin apply failed|Mixin transformation of|was not found in|Critical injection failure|Error injecting" "mixin failures"
          refute "Failed to start the minecraft server|Exception in server tick loop" "server crashes"

          if [ "$fail" -ne 0 ]; then
            echo "smoke test failed - last 80 lines of the server log:"
            tail -80 server.log
            exit 1
          fi
          echo "smoke test passed"

      - name: start the server again, with the lobby switched on
        run: |
          set -o pipefail
          echo "===== what the mod wrote into the world ====="
          find run/world/datapacks -type f | sort
          echo "--- pack.mcmeta ---"
          cat run/world/datapacks/astra_lobby/pack.mcmeta
          echo "--- dimension ---"
          cat run/world/datapacks/astra_lobby/data/astra/dimension/lobby.json
          echo "--- lobby.json (mod state) ---"
          cat run/config/freezemute/lobby.json

          LAUNCHER=$(ls run | grep -E '^fabric-server-(launch|launcher).*\.jar$' | head -1)

          cd run
          ( sleep 75
            echo "lobby enable"
            sleep 5
            echo "lobby status"
            sleep 3
            echo "lobby leave"
            sleep 3
            echo "lobby generate"
            sleep 3
            echo "lobby generate confirm"
            sleep 25
            echo "lobby course list"
            sleep 3
            echo "lobby status"
            sleep 3
            echo "queue status"
            sleep 3
            echo "queue list"
            sleep 3
            echo "queue early list"
            sleep 3
            echo "queue remove Nobody"
            sleep 3
            echo "lobby queuepoint clear"
            sleep 3
            echo "lobby status"
            sleep 3
            echo "queue close"
            sleep 3
            echo "lobby setspawn"
            sleep 3
            echo "lobby course start spawn"
            sleep 3
            echo "lobby course top spawn"
            sleep 3
            echo "lobby npc"
            sleep 3
            echo "lobby npc clear"
            sleep 3
            echo "queue end"
            sleep 3
            echo "lobby disable"
            sleep 3
            echo "stop"
            sleep 20 ) | timeout 420 java -Xmx2G -jar "$LAUNCHER" nogui 2>&1 | tee second.log || true

          echo "===================== assertions ====================="
          fail=0
          check() {
            if grep -qF "$1" second.log; then
              echo "OK      : $2"
            else
              echo "MISSING : $2"
              fail=1
            fi
          }
          refute() {
            if grep -qE "$1" second.log; then
              echo "FOUND BAD: $2"
              grep -E "$1" second.log | head -5
              fail=1
            else
              echo "OK      : no $2"
            fi
          }

          check "Done (" "server finished starting"
          check "Lobby dimension: astra:lobby is ready" "the dimension the data pack describes was built"
          check "cap 8" "the cap set on the previous run survived the restart"
          check "The lobby is on." "/lobby enable turned the lobby on"
          check "dimension: astra:lobby" "/lobby status found the dimension"
          check "Only a player can leave the lobby." "/lobby leave is registered"
          check "This will build an island" "/lobby generate says what it would do before doing it"
          check "Laying the island:" "/lobby generate confirm started laying the island"
          check "Lobby: laying an island at" "the builder logged what it was about to lay"
          check "Lobby: finished laying" "the build ran to the last block instead of stalling part way"
          check "the queue point is the pedestal" "the pedestal became the queue point"
          check "checkpoint(s), ready" "the parkour course was registered as it was built"
          check "right click the queue point" "arriving no longer queues people on its own"
          check "Nobody is not in the queue and holds no slot." "/queue remove is registered"
          check "Queue point cleared" "/lobby queuepoint clear is registered"
          check "automatic on arrival, there is no queue point" "clearing the point goes back to auto queueing"
          check "routing: on" "/lobby status reports the lobby is routing"
          check "Nobody is waiting and nobody is in." "/queue list ran"
          check "Nobody is on the early access list." "/queue early list ran"
          check "The queue is closed" "/queue close ran"
          check "Session over" "/queue end ran"
          check "the line comes back - closed - within the second" \
            "/queue end says the line rebuilds itself with no queue point set"
          check "Stand where you want the spawn to be" "/lobby setspawn refuses a console with no position"
          check "Stand where you want the marker" "/lobby course start is registered and reaches its guard"
          check "Nobody has finished spawn yet" "/lobby course top reads the board of the built course"
          check "Join record!" "the figure on the pedestal carries the name it was asked for"
          check "Lobby: put a figure on the queue point" "an armour stand really was spawned"
          check "the queue point still works" "/lobby npc clear took it away again"
          check "figure standing on it" "/lobby generate confirm stood one on the pedestal itself"
          refute "is not an item id|this version has no item called" "an item the figure could not wear"
          check "The lobby is off" "/lobby disable turned it back off"
          refute "does not exist yet" "a missing lobby dimension"
          refute "Unknown or incomplete command" "unrecognised command"
          refute "Mixin apply failed|Critical injection failure|Error injecting" "mixin failures"
          refute "Exception in server tick loop" "a crash in the tick hook"

          if [ "$fail" -ne 0 ]; then
            echo "lobby test failed - last 100 lines of the server log:"
            tail -100 second.log
            exit 1
          fi
          echo "lobby test passed"

      # Today's file handling changed what happens when the mod cannot read one of its own files.
      # Both paths only matter on a real server reading real files, so they are checked on one.
      - name: start again with both of the mod's files broken
        run: |
          set -o pipefail
          BROKEN_CONFIG='{ "lobbyQueueGraceSeconds": 42 "lobbyIsolateMembers": false }'
          BROKEN_LOBBY='{ "cap": 8, "courses": [ everything anybody built ] '

          printf '%s' "$BROKEN_CONFIG" > run/config/freezemute/config.json
          printf '%s' "$BROKEN_LOBBY" > run/config/freezemute/lobby.json
          rm -f run/config/freezemute/lobby.json.unreadable-*

          LAUNCHER=$(ls run | grep -E '^fabric-server-(launch|launcher).*\.jar$' | head -1)

          cd run
          ( sleep 75
            echo "queue status"
            sleep 3
            echo "stop"
            sleep 20 ) | timeout 300 java -Xmx2G -jar "$LAUNCHER" nogui 2>&1 | tee third.log || true

          echo "===================== assertions ====================="
          fail=0
          check() {
            if grep -qF "$1" third.log; then
              echo "OK      : $2"
            else
              echo "MISSING : $2"
              fail=1
            fi
          }

          check "Done (" "the server still started with both files unreadable"
          check "Using the default settings for this run and leaving" "the config said it was leaving the file alone"
          check "Kept the unreadable" "the lobby file was kept rather than replaced"

          echo "--- the config file after the run ---"
          cat config/freezemute/config.json
          echo
          if [ "$(cat config/freezemute/config.json)" = "$BROKEN_CONFIG" ]; then
            echo "OK      : the config file was left exactly as it was"
          else
            echo "MISSING : the config file was rewritten, taking their settings with it"
            fail=1
          fi

          KEPT=$(ls config/freezemute/lobby.json.unreadable-* 2>/dev/null | head -1)
          if [ -n "$KEPT" ] && [ "$(cat "$KEPT")" = "$BROKEN_LOBBY" ]; then
            echo "OK      : the unreadable lobby file was kept intact at $KEPT"
          else
            echo "MISSING : nothing was kept, so the courses and times would be gone for good"
            ls -la config/freezemute/ || true
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "broken-file test failed - last 60 lines:"
            tail -60 third.log
            exit 1
          fi
          echo "broken-file test passed"

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: build/libs/

  # The plugin that does the voice muting is loaded by Simple Voice Chat, not by us, so the only
  # way to know it registered is to put the voice chat mod on a server and look.
  voicechat:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew --no-daemon build

      - name: start a server with simple voice chat installed
        run: |
          set -o pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          INSTALLER=$(curl -sS --max-time 60 https://maven.fabricmc.net/net/fabricmc/fabric-installer/maven-metadata.xml \
            | grep -o '<release>[^<]*' | cut -d'>' -f2)

          curl -sSL --max-time 300 -o fabric-installer.jar \
            "https://maven.fabricmc.net/net/fabricmc/fabric-installer/$INSTALLER/fabric-installer-$INSTALLER.jar"

          mkdir -p run/mods
          java -jar fabric-installer.jar server -dir run -mcversion "$MC" -loader "$LOADER" -downloadMinecraft
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} run/mods/ \;

          # Simple Voice Chat needs Fabric API; this mod does not, but the test server does now.
          fetch() {
            URL=$(curl -sS --max-time 60 \
              "https://api.modrinth.com/v2/project/$1/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$MC%22%5D" \
              | jq -r 'first(.[] | .files[] | select(.primary) | .url) // empty')
            if [ -z "$URL" ]; then
              echo "MISSING: no $1 build published for $MC"
              return 1
            fi
            echo "downloading $1: $URL"
            curl -sSL --max-time 300 -o "run/mods/$1.jar" "$URL"
          }

          VOICE_INSTALLED=1
          fetch fabric-api || VOICE_INSTALLED=0
          fetch simple-voice-chat || VOICE_INSTALLED=0
          echo "VOICE_INSTALLED=$VOICE_INSTALLED" >> "$GITHUB_ENV"
          ls -la run/mods

          echo "eula=true" > run/eula.txt
          {
            echo "online-mode=false"
            echo "level-type=minecraft:flat"
            echo "spawn-protection=0"
            echo "max-players=5"
            echo "sync-chunk-writes=false"
          } > run/server.properties

          LAUNCHER=$(ls run | grep -E '^fabric-server-(launch|launcher).*\.jar$' | head -1)

          cd run
          # Auto update is deliberately left on here: the running build is newer than the newest
          # release, so the check has to come back with nothing to do. That exercises the GitHub
          # request and the version comparison without ever swapping a jar out.
          ( sleep 90
            echo "vcstatus"
            sleep 3
            echo "vclist"
            sleep 3
            echo "stop"
            sleep 20 ) | timeout 420 java -Xmx2G -jar "$LAUNCHER" nogui 2>&1 | tee server.log || true

          echo "===================== assertions ====================="
          fail=0
          check() {
            if grep -qF "$1" server.log; then
              echo "OK      : $2"
            else
              echo "MISSING : $2"
              fail=1
            fi
          }

          check "Done (" "server finished starting"
          check "Auto update:" "the update check ran"
          check "nothing to do" "the update check found nothing newer than the build under test"

          if [ "$VOICE_INSTALLED" = "1" ]; then
            check "Simple Voice Chat found" "the mod noticed the voice chat mod"
            check "Voice chat plugin registered" "simple voice chat loaded this mod's plugin"
            check "the plugin is active" "/vcstatus reports the plugin is enforcing"
          else
            echo "SKIPPED : simple voice chat has no build for $MC, plugin registration not checked"
          fi

          if grep -qE "Mixin apply failed|Critical injection failure|Exception in server tick loop" server.log; then
            echo "FOUND BAD: startup failures"
            grep -E "Mixin apply failed|Critical injection failure|Exception in server tick loop" server.log | head -5
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "voice chat test failed - last 80 lines of the server log:"
            tail -80 server.log
            exit 1
          fi
          echo "voice chat test passed"
