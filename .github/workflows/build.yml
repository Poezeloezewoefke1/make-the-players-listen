# Builds the mod on every push and pull request.
#
# This is the real compile check: Loom needs maven.fabricmc.net and Mojang's
# library servers, which the runners can reach.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: dump the pinned mappings for the classes we build against
        continue-on-error: true
        run: |
          PINNED=$(grep '^yarn_mappings=' gradle.properties | cut -d= -f2 | tr -d '\r')
          URL="https://maven.fabricmc.net/net/fabricmc/yarn/${PINNED}/yarn-${PINNED}-v2.jar"
          curl -sSL --max-time 120 -o yarn.jar "$URL"
          unzip -o -q yarn.jar -d yarn-mappings
          TINY=$(find yarn-mappings -name '*.tiny' | head -1)
          echo "mappings: $PINNED ($TINY)"

          # Members are "<tab>m<tab><descriptor><tab><intermediary><tab><named>" under a
          # "c<tab><intermediary><tab><named>" line, so print the block after the class line.
          dump() {
            local n
            n=$(grep -n -m1 -P "^c\t[^\t]+\t$1\$" "$TINY" | cut -d: -f1)
            echo "===== $1 ====="
            if [ -z "$n" ]; then
              echo "(not found in this build)"
              return
            fi
            sed -n "${n},$((n + 45))p" "$TINY"
          }

          dump net/minecraft/registry/DynamicRegistryManager
          dump net/minecraft/registry/Registry
          dump net/minecraft/registry/Registries

      - name: build
        run: ./gradlew build --stacktrace

      - name: show mappings available for this minecraft version
        if: always()
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          PINNED=$(grep '^yarn_mappings=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "MAPPINGS minecraft_version=[$MC] pinned=[$PINNED]"
          curl -sS --max-time 60 https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml > /tmp/yarn.xml || true
          echo "MAPPINGS available builds:"
          grep -o "<version>$MC+build\.[0-9]*</version>" /tmp/yarn.xml | sed 's|</\?version>||g' | tail -10 \
            || echo "MAPPINGS none found for $MC"

      - name: check the jar is a usable mod
        run: |
          set -euo pipefail
          JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' | head -1)
          echo "checking $JAR"

          fail=0

          # The version placeholder must have been expanded by processResources. A jar that
          # still says ${version} is the sources jar, which Fabric loads and then fails on.
          if unzip -p "$JAR" fabric.mod.json | grep -q '\${version}'; then
            echo "FAIL: fabric.mod.json still contains the unexpanded version placeholder"
            fail=1
          else
            echo "OK  : fabric.mod.json version is expanded"
          fi

          # Every mixin named in the config has to be present as a compiled class.
          for mixin in $(unzip -p "$JAR" freezemute.mixins.json | grep -oE '"[A-Za-z]+Mixin"' | tr -d '"'); do
            if unzip -l "$JAR" | grep -q "dev/mtpl/freezemute/mixin/${mixin}.class"; then
              echo "OK  : $mixin is compiled into the jar"
            else
              echo "FAIL: $mixin is named in freezemute.mixins.json but not in the jar"
              fail=1
            fi
          done

          if unzip -l "$JAR" | grep -q 'dev/mtpl/freezemute/FreezeMute.class'; then
            echo "OK  : entrypoint class is present"
          else
            echo "FAIL: entrypoint class is missing"
            fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "jar contents:"; unzip -l "$JAR"; exit 1; }

      - name: start a real server with the mod (smoke test)
        run: |
          set -o pipefail
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          INSTALLER=$(curl -sS --max-time 60 https://maven.fabricmc.net/net/fabricmc/fabric-installer/maven-metadata.xml \
            | grep -o '<release>[^<]*' | cut -d'>' -f2)
          echo "minecraft=$MC loader=$LOADER installer=$INSTALLER"

          curl -sSL --max-time 300 -o fabric-installer.jar \
            "https://maven.fabricmc.net/net/fabricmc/fabric-installer/$INSTALLER/fabric-installer-$INSTALLER.jar"

          mkdir -p run/mods
          java -jar fabric-installer.jar server -dir run -mcversion "$MC" -loader "$LOADER" -downloadMinecraft
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} run/mods/ \;
          ls -la run/mods

          echo "eula=true" > run/eula.txt
          {
            echo "online-mode=false"
            echo "level-type=minecraft:flat"
            echo "spawn-protection=0"
            echo "max-players=5"
            echo "sync-chunk-writes=false"
          } > run/server.properties

          LAUNCHER=$(ls run | grep -E '^fabric-server-(launch|launcher).*\.jar$' | head -1)
          echo "launcher=$LAUNCHER"

          cd run
          # Give the server time to come up, then drive it through the console.
          ( sleep 75
            echo "freezelist"
            sleep 3
            echo "mutelist"
            sleep 3
            echo "help kitgive"
            sleep 3
            echo "stop"
            sleep 20 ) | timeout 300 java -Xmx2G -jar "$LAUNCHER" nogui 2>&1 | tee server.log || true

          echo "===================== assertions ====================="
          fail=0
          check() {
            if grep -qF "$1" server.log; then
              echo "OK      : $2"
            else
              echo "MISSING : $2"
              fail=1
            fi
          }
          refute() {
            if grep -qE "$1" server.log; then
              echo "FOUND BAD: $2"
              grep -E "$1" server.log | head -5
              fail=1
            else
              echo "OK      : no $2"
            fi
          }

          check "Ready - operators can use" "mod initialised"
          check "Done (" "server finished starting"
          check "Nobody is frozen." "/freezelist ran from the console"
          check "Nobody is muted." "/mutelist ran from the console"
          check "Kit enchantments are on" "the enchantment registry lookup resolved"
          check "kitgive" "/kitgive registered"
          check "iron_diamond" "the iron/diamond tier registered"
          check "diamond_netherite" "the diamond/netherite tier registered"
          refute "Kit enchantments are off" "broken enchantment registry lookup"
          refute "Unknown or incomplete command" "unrecognised command"
          refute "Mixin apply failed|Mixin transformation of|was not found in|Critical injection failure|Error injecting" "mixin failures"
          refute "Failed to start the minecraft server|Exception in server tick loop" "server crashes"

          if [ "$fail" -ne 0 ]; then
            echo "smoke test failed - last 80 lines of the server log:"
            tail -80 server.log
            exit 1
          fi
          echo "smoke test passed"

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: build/libs/
